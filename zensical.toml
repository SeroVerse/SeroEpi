[project]
site_url = "https://seroverse.github.io/SeroEpi/"
site_name = "SeroEpi"
site_description = "Python library for bacterial sero-epidemiology, Bayesian prevalence estimation, and vaccine formulation"
site_author = "Tom Stanton"
copyright = """
Copyright &copy; 2026 <a href="https://tomdstanton.com" target="_blank" rel="noopener">Tom Stanton</a> — SeroVerse
"""

repo_url = "https://github.com/SeroVerse/SeroEpi"
repo_name = "SeroVerse/SeroEpi"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"
watch = ["src"]

nav = [
  { "Home" = "index.md" },
  { "App" = "app.md" },
  { "Architecture & ADRs" = [
    { "Glossary" = "glossary.md" },
    { "ADR 001: Variable Identity" = "adr/001-strict-variable-identity-and-lookup.md" },
    { "ADR 002: Aggregator & Pipeline" = "adr/002-aggregator-transformer-and-pipeline-contract.md" },
    { "ADR 003: Stratified Result Mixin" = "adr/003-unified-stratified-result-mixin.md" },
  ] },
  { "Community" = [
    "conduct.md",
    "contributing.md",
    "releases.md",
  ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/chart-network"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-purple"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-purple"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SeroVerse/SeroEpi"
name = "SeroVerse/SeroEpi on GitHub"

[[project.extra.social]]
icon = "lucide/app-window"
link = "https://seroverse-seroepi.hf.space"
name = "SeroEpi Interactive Web App"

[project.plugins.search]
enabled = true

[project.plugins.autorefs]
enabled = true

[project.plugins.gh-admonitions]
enabled = true

[project.plugins.glightbox]
enabled = true

[project.plugins.llmstxt]
enabled = true
markdown_description = "SeroEpi: Python library for bacterial sero-epidemiology, stratified Bayesian prevalence modelling (JAX/NumPyro NUTS MCMC & SVI), LOSO-validated vaccine formulation optimization, and interactive PyShiny surveillance analytics."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Overview & Application" = [
  { "index.md" = "Overview, Bayesian estimators, formulation optimization, and quickstart" },
  { "app.md" = "Interactive PyShiny web application hosted on Hugging Face Spaces" },
]
"Architecture & ADRs" = [
  { "glossary.md" = "Core epidemiological and statistical terminology" },
  { "adr/001-strict-variable-identity-and-lookup.md" = "Strict variable identity and lookup contract" },
  { "adr/002-aggregator-transformer-and-pipeline-contract.md" = "Aggregator transformer and scikit-learn pipeline contract" },
  { "adr/003-unified-stratified-result-mixin.md" = "Unified stratified result mixin" },
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
