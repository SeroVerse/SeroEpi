repos:
- repo: local
  hooks:
  - id: ruff-format
    name: ruff format
    entry: uv run --group lint ruff format
    language: system
    types: [python]
    require_serial: true
  - id: ruff-check
    name: ruff check
    entry: uv run --group lint ruff check --fix
    language: system
    types: [python]
    require_serial: true
  - id: ty-check
    name: ty check
    entry: uv run --group typing ty check src
    language: system
    types: [python]
    pass_filenames: false
  - id: zenzic-guard
    name: zenzic guard
    entry: uv run --group docs zenzic guard scan
    language: system
    pass_filenames: false
    files: \.(md|mdx|toml)$
  - id: zenzic-check
    name: zenzic check
    entry: uv run --group docs zenzic check all --quiet
    language: system
    pass_filenames: false
    files: \.(md|toml)$
  - id: pytest-test
    name: pytest test
    entry: uv run --group test pytest --testmon
    language: system
    types: [python]
    pass_filenames: false
